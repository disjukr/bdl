name: Publish VS Code Extension

on:
  push:
    tags:
      - "bdl-vscode@*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply version from tag
        working-directory: bdl-vscode
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module - <<'EOF'
          const tagName = process.env.GITHUB_REF_NAME || "";
          const match = tagName.match(/^bdl-vscode@(.+)$/);
          if (!match) {
            throw new Error(`Unexpected tag format: ${tagName}`);
          }
          const { readFile, writeFile } = await import("node:fs/promises");
          const packageJsonPath = "package.json";
          const packageJsonText = await readFile(packageJsonPath, "utf8");
          const packageJson = JSON.parse(packageJsonText);
          packageJson.version = match[1];
          await writeFile(
            packageJsonPath,
            `${JSON.stringify(packageJson, null, 2)}\n`,
          );
          console.log(`Applied version ${match[1]} to ${packageJsonPath}`);
          EOF

      - name: Build extension
        run: pnpm --filter @disjukr/bdl-runtime build && pnpm --filter bdl build && pnpm --dir bdl-vscode build

      - name: Publish to Open VSX
        id: publish_openvsx
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          packagePath: ./bdl-vscode
          dependencies: false
          skipDuplicate: true

      - name: Publish to VS Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.publish_openvsx.outputs.vsixPath }}
          dependencies: false
          skipDuplicate: true
